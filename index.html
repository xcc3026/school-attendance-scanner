<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>School Attendance QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .camera-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .camera-button {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .camera-button.active {
      outline: 3px solid #333;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .waiting {
      background: #f3f4f6;
      color: #555;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .student-name-c {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .student-name {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .student-info {
      font-size: 18px;
      margin: 4px 0;
    }

    .qr-number {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>🏫 School Attendance</h1>

    <div class="subtitle">
      扫描学生 QR Code<br>
      <b>Imbas QR Kod Murid</b>
    </div>

    <div id="reader"></div>


    <div class="camera-buttons">

      <button
        id="backButton"
        class="camera-button"
        onclick="changeCamera('back')">

        📷 后置镜头<br>
        Kamera Belakang

      </button>


      <button
        id="frontButton"
        class="camera-button"
        onclick="changeCamera('front')">

        🤳 前置镜头<br>
        Kamera Hadapan

      </button>

    </div>


    <div
      id="result"
      class="waiting">

      📷 等待扫描...<br>
      Menunggu imbasan...

    </div>

  </div>


<script>


/*
 * ================================
 * Apps Script Web App
 * ================================
 */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwdK4-0DDAvOhwIn8d_bPTmmKGMO7myI6gWkNUIMT7FIcHvaX2KDMRVup8bnDOhMIBk/exec";


/*
 * ================================
 * Scanner variables
 * ================================
 */

let scanner = null;

let cameras = [];

let currentCamera = null;

let lastCode = "";

let lastScanTime = 0;

let isProcessing = false;

let isSwitching = false;


/*
 * ================================
 * 三语语音
 *
 * 0 = 中文
 * 1 = English
 * 2 = Bahasa Melayu
 * ================================
 */

let languageIndex = 0;


/*
 * ================================
 * 显示结果
 * ================================
 */

function showResult(
  message,
  type
) {

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = message;

}


/*
 * ================================
 * 语音
 * ================================
 */

function speak(
  text,
  language
) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang =
    language;

  speech.rate =
    1.1;

  speech.pitch =
    1;


  window.speechSynthesis.speak(
    speech
  );

}


/*
 * ================================
 * 播放三语短句
 * ================================
 */

function speakGreeting() {

  if (languageIndex === 0) {

    speak(
      "早安，加油！",
      "zh-CN"
    );

  }

  else if (languageIndex === 1) {

    speak(
      "Good morning!",
      "en-US"
    );

  }

  else {

    speak(
      "Selamat pagi!",
      "ms-MY"
    );

  }


  languageIndex++;


  if (
    languageIndex >= 3
  ) {

    languageIndex = 0;

  }

}


/*
 * ================================
 * 寻找相机
 * ================================
 */

function findCamera(
  type
) {

  if (
    type === "back"
  ) {

    return cameras.find(
      function(camera) {

        const label =
          camera.label.toLowerCase();

        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        );

      }
    );

  }


  if (
    type === "front"
  ) {

    return cameras.find(
      function(camera) {

        const label =
          camera.label.toLowerCase();

        return (
          label.includes("front") ||
          label.includes("user")
        );

      }
    );

  }


  return null;

}


/*
 * ================================
 * 更新相机按钮
 * ================================
 */

function updateCameraButtons(
  type
) {

  document
    .getElementById("backButton")
    .classList.remove("active");

  document
    .getElementById("frontButton")
    .classList.remove("active");


  if (
    type === "back"
  ) {

    document
      .getElementById("backButton")
      .classList.add("active");

  }


  if (
    type === "front"
  ) {

    document
      .getElementById("frontButton")
      .classList.add("active");

  }

}


/*
 * ================================
 * 开始指定相机
 * ================================
 */

function startCamera(
  camera,
  type
) {

  const config = {

    fps: 15,

    qrbox: {
      width: 220,
      height: 220
    },

    rememberLastUsedCamera: true,

    showTorchButtonIfSupported: true,

    showZoomSliderIfSupported: true

  };


  scanner.start(

    camera.id,

    config,

    function(decodedText) {

      handleQR(
        decodedText
      );

    },

    function() {

      /*
       * 正常扫描失败
       * 不显示错误
       */

    }

  )

  .then(function() {

    currentCamera =
      type;

    updateCameraButtons(
      type
    );

    isSwitching =
      false;

  })

  .catch(function(error) {

    console.error(error);

    isSwitching =
      false;

    showResult(

      "❌ 无法开启相机<br>" +
      "Tidak dapat membuka kamera",

      "error"

    );

  });

}


/*
 * ================================
 * 切换相机
 * ================================
 */

function changeCamera(
  type
) {

  if (
    isSwitching ||
    currentCamera === type
  ) {

    return;

  }


  const camera =
    findCamera(type);


  if (!camera) {

    showResult(

      "⚠️ 找不到此相机<br>" +
      "Kamera tidak dijumpai",

      "error"

    );

    return;

  }


  isSwitching =
    true;


  if (
    scanner.isScanning
  ) {

    scanner.stop()

      .then(function() {

        return scanner.clear();

      })

      .then(function() {

        scanner =
          new Html5Qrcode(
            "reader"
          );

        startCamera(
          camera,
          type
        );

      })

      .catch(function(error) {

        console.error(error);

        isSwitching =
          false;

      });

  }

  else {

    startCamera(
      camera,
      type
    );

  }

}


/*
 * ================================
 * 查询学生资料
 * ================================
 */

async function getStudent(
  qrCode
) {

  try {

    const cleanCode =
      qrCode.trim();

    const url =
      API_URL +
      "?action=student" +
      "&barcode=" +
      encodeURIComponent(
        cleanCode
      );

    const response =
      await fetch(url);

    if (!response.ok) {

      throw new Error(
        "Network response was not OK"
      );

    }

    return await response.json();

  }

  catch (error) {

    console.error(
      "API Error:",
      error
    );

    return {
      success: false,
      message:
        "无法连接学生资料系统"
    };

  }

}

  catch (error) {

    console.error(
      "API Error:",
      error
    );


    return {
      success: false,
      message:
        "无法连接学生资料系统"
    };

  }

}


/*
 * ================================
 * 显示学生资料
 * ================================
 */

function showStudent(
  student
) {

  showResult(

    "<div class='student-name-c'>" +
      student.FullNameC +
    "</div>",

    "success"

  );

}


/*
 * ================================
 * QR 扫描成功
 * ================================
 */
async function handleQR(qrCode) {

  if (isProcessing) {
    return;
  }

  if (qrCode === lastCode) {
    return;
  }

  isProcessing = true;

  lastCode = qrCode;
  lastScanTime = Date.now();

  showResult(
    "🔍 查询学生资料...<br>" +
    "Mencari maklumat murid...",
    "waiting"
  );

  try {

    const result =
      await getStudent(
        qrCode.trim()
      );

    console.log(
      "API RESULT:",
      JSON.stringify(result)
    );

    /*
     * 学生不存在
     */

    if (
      !result ||
      result.success !== true
    ) {

      showResult(

        "❌ 找不到学生<br>" +
        "Murid tidak dijumpai",

        "error"

      );

      return;
    }


    /*
     * 取得学生资料
     */

    let student =
      result.student;

    if (
      student &&
      student.student
    ) {

      student =
        student.student;

    }


    /*
     * 确认学生资料
     */

    if (
      !student ||
      !student.StudentID
    ) {

      showResult(

        "❌ 学生资料错误<br>" +
        "Maklumat murid tidak sah",

        "error"

      );

      return;
    }


    /*
     * ================================
     * 记录 Attendance
     * ================================
     */

    const attendanceUrl =
      API_URL +
      "?action=attendance" +
      "&studentID=" +
      encodeURIComponent(
        student.StudentID
      );


    const attendanceResponse =
      await fetch(
        attendanceUrl
      );


    const attendanceResult =
      await attendanceResponse.json();


    console.log(
      "ATTENDANCE RESULT:",
      attendanceResult
    );


    /*
     * ================================
     * 今天已经签到
     * ================================
     */

    if (
      attendanceResult.success === false &&
      attendanceResult.message ===
      "Student has already checked in today."
    ) {

      showResult(

        "<div class='student-name-c'>" +
          student.FullNameC +
        "</div>" +

        "<br>" +

        "<div>" +
          "⚠️ 今天已经点名" +
        "</div>" +

        "<div>" +
          "Already checked in" +
        "</div>" +

        "<div>" +
          "Sudah hadir" +
        "</div>",

        "error"

      );

    }


    /*
     * ================================
     * 新的 Attendance
     * ================================
     */

    else if (
      attendanceResult.success === true
    ) {


      /*
       * 正常出席
       */

      if (
        attendanceResult.status ===
        "Present"
      ) {

        showResult(

          "<div class='student-name-c'>" +
            student.FullNameC +
          "</div>" +

          "<br>" +

          "<div>" +
            "🟢 出席成功" +
          "</div>" +

          "<div>" +
            "Present · Hadir" +
          "</div>",

          "success"

        );


        speak(
          "Present. Hadir."
        );

      }


      /*
       * 迟到
       */

      else if (
        attendanceResult.status ===
        "Late"
      ) {

        showResult(

          "<div class='student-name-c'>" +
            student.FullNameC +
          "</div>" +

          "<br>" +

          "<div>" +
            "🔴 迟到" +
          "</div>" +

          "<div>" +
            "Late · Lewat" +
          "</div>",

          "error"

        );


        speak(
          "Late. Lewat."
        );

      }


      /*
       * 其他状态
       */

      else {

        showResult(

          "<div class='student-name-c'>" +
            student.FullNameC +
          "</div>" +

          "<br>" +

          "<div>" +
            "⚠️ " +
            attendanceResult.status +
          "</div>",

          "error"

        );

      }

    }


    /*
     * Attendance 失败
     */

    else {

      showResult(

        "❌ 出席记录失败<br>" +
        "Attendance failed<br>" +
        "Rekod kehadiran gagal",

        "error"

      );

    }

  }


  catch (error) {

    console.error(
      "QR ERROR:",
      error
    );


    showResult(

      "❌ 系统错误<br>" +
      "Ralat sistem",

      "error"

    );

  }


  /*
   * 2 秒后准备下一位
   */

  setTimeout(

    function() {

      showResult(

        "📷 等待下一位学生...<br>" +
        "Menunggu murid seterusnya...",

        "waiting"

      );

      isProcessing =
        false;

      lastCode =
        "";

    },

    1000

  );

}
/*
 * ================================
 * 初始化 Scanner
 * ================================
 */

function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );

  Html5Qrcode
    .getCameras()

    .then(function(cameraList) {

      console.log(
  "CAMERAS:",
  cameraList
);
      
      cameras =
        cameraList;

      if (
        cameras.length === 0
      ) {

        showResult(
          "❌ 找不到相机<br>" +
          "Tiada kamera dijumpai",
          "error"
        );

        return;

      }

      const backCamera =
        findCamera("back");

      if (backCamera) {

        startCamera(
          backCamera,
          "back"
        );

      } else {

        startCamera(
          cameras[0],
          "front"
        );

      }

    })

    .catch(function(error) {

      console.error(error);

      showResult(
        "❌ 无法获取相机<br>" +
        "Tidak dapat mendapatkan kamera",
        "error"
      );

    });

}

startScanner();
</script>

</body>

</html>
