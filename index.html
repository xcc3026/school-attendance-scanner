<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Attendance</title>
  <!-- 引入外部开源扫码库 -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    /* 此处保留你原本完美的 CSS 样式配置 */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 15px; font-family: Arial, "Noto Sans SC", sans-serif; background: #f3f4f6; color: #111827; }
    .container { max-width: 700px; margin: auto; }
    .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; }
    button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .login-button { background: #2563eb; color: white; font-size: 18px; padding: 18px; }
    .teacher-button { background: #16a34a; color: white; font-size: 18px; padding: 18px; }
    .secondary-button { background: #e5e7eb; color: #111827; }
    input, select { width: 100%; padding: 13px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; background: white; }
    label { display: block; text-align: left; font-weight: bold; margin-top: 8px; }
    .hidden { display: none !important; }
    #reader { width: 100%; margin: auto; border-radius: 12px; overflow: hidden; }
    #scanResult { margin-top: 15px; padding: 20px; border-radius: 12px; min-height: 130px; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; line-height: 1.6; font-weight: bold; }
    .scan-waiting { background: #f3f4f6; color: #555; }
    .scan-success { background: #dcfce7; color: #166534; }
    .scan-error { background: #fee2e2; color: #991b1b; }
    .scan-late { background: #fef9c3; color: #92400e; }
    .student-name-c { font-size: 28px; margin-bottom: 5px; }
    .small-text { font-size: 13px; color: #6b7280; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 标题头部 -->
  <div class="card">
    <h1>学校考勤系统</h1>
    <p style="text-align:center; color:#6b7280; margin:0;">School Attendance Scanner System</p>
  </div>

  <!-- 扫码主界面卡片 -->
  <div class="card" id="scannerSection">
    <h2>扫码打卡 / Imbas Kehadiran</h2>
    
    <!-- HTML5-QRCode 摄像头渲染容器 -->
    <div id="reader"></div>
    
    <!-- 扫描状态回显区 -->
    <div id="scanResult" class="scan-waiting">
      <div id="resultText">准备就绪，请将二维码/条形码对准摄像头<br>Sedia, sila halakan kod pada kamera.</div>
    </div>
  </div>

</div>

<script>
  // ==========================================
  // 关键配置：请替换为你部署的 Google Web App URL
  // ==========================================
  const GOOGLE_API_URL = "https://google.com"; 

  let html5QrcodeScanner = null;
  let isProcessing = false; // 高并发节流锁，防止同一张图连续解析多次触发重复提交

  // 网页加载时自动启动摄像头扫描
  window.addEventListener('DOMContentLoaded', () => {
    startCameraScanner();
  });

  /**
   * 初始化并启动摄像头扫码
   */
  function startCameraScanner() {
    const config = { 
      fps: 6,           // 每秒帧数，5-6帧足够，过高会导致低配手机浏览器卡顿
      qrbox: (width, height) => {
        // 动态计算探测悬浮框大小（自适应屏幕窄边宽度的 65%）
        const minEdge = Math.min(width, height);
        const boxSize = Math.floor(minEdge * 0.65);
        return { width: boxSize, height: boxSize };
      },
      rememberLastUsedCamera: true // 记住用户上次授权的摄像头（前置/后置）
    };

    // 使用库自带的集成界面 Scanner 配置
    html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false);
    html5QrcodeScanner.render(onScanSuccess, onScanError);
  }

  /**
   * 扫码成功回调（识别到字符串内容）
   */
  function onScanSuccess(decodedText, decodedResult) {
    if (isProcessing) return; // 拦截器：上一条请求还没处理完时，忽略当前帧内容
    isProcessing = true;

    // 播放打卡嘀声回执（使用浏览器震荡器产生标准 Beep 音）
    playBeep(2000, 100);

    const resultDiv = document.getElementById("scanResult");
    const textDiv = document.getElementById("resultText");

    // UI 显示正在提交云端
    resultDiv.className = "scan-waiting";
    textDiv.innerHTML = `正在记录云端数据...<br>Processing: <strong>${decodedText}</strong>`;

    // 封装标准负载数据发送给 Google apps script API
    const payload = {
      data: decodedText,
      method: "CAMERA_SCAN" // 标记来源为网页摄像头
    };

    // 采用 fetch 发送跨域 POST 请求
    fetch(GOOGLE_API_URL, {
      method: "POST",
      mode: "no-cors", // Google App Script 跨域跳转的标准模式
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      // 注意：由于 no-cors 模式无法在前端直接读取返回的 JSON 属性，
      // 云端只要成功接收并通过 LockService 写入即代表打卡完成。
      resultDiv.className = "scan-success";
      textDiv.innerHTML = `
        <div class="student-name-c">打卡提交成功</div>
        <div class="small-text">已发送至云端表格进行考勤校对</div>
        <div class="small-text">Data <b>${decodedText}</b> berjaya dihantar.</div>
      `;
      playBeep(1200, 150); // 提交成功低音回执
      
      // 1.5 秒后解除节流锁，允许进行下一次学生扫码
      setTimeout(() => { isProcessing = false; }, 1500);
    })
    .catch(error => {
      console.error("提交失败:", error);
      resultDiv.className = "scan-error";
      textDiv.innerHTML = `网络提交失败 / Gagal hantar: ${error.message}`;
      
      setTimeout(() => { isProcessing = false; }, 2000);
    });
  }

  /**
   * 扫码失败回调（通常是没有对焦成功或图像模糊，属于高频高并发触发，无需弹窗阻断）
   */
  function onScanError(errorMessage) {
    // 这里可以选择静默跳过，避免控制台产生大量环境杂音日志
  }

  /**
   * 浏览器原生无音频文件纯代码生成打卡提示音（解决加载外部 mp3 慢的问题）
   */
  function playBeep(frequency, duration) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.frequency.value = frequency;
      oscillator.type = 'sine';
      oscillator.start();
      setTimeout(() => { oscillator.stop(); audioCtx.close(); }, duration);
    } catch (e) {
      console.log("音频上下文被阻拦或不支持:", e);
    }
  }
</script>
</body>
</html>
