<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Attendance QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .camera-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .camera-button {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #e5e7eb;
    }

    .camera-button.active {
      outline: 3px solid #333;
      background: #d1d5db;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .waiting {
      background: #f3f4f6;
      color: #555;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .late {
      background: #fef9c3;
      color: #92400e;
    }

    .student-name-c {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .student-info {
      font-size: 16px;
      color: #4b5563;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🏫 School Attendance</h1>
    <div class="subtitle">
      扫描学生 QR Code<br>
      <b>Imbas QR Kod Murid</b>
    </div>

    <div id="reader"></div>

    <div class="camera-buttons">
      <button id="backButton" class="camera-button" onclick="changeCamera('back')">
        📷 后置镜头<br>Kamera Belakang
      </button>
      <button id="frontButton" class="camera-button" onclick="changeCamera('front')">
        🤳 前置镜头<br>Kamera Hadapan
      </button>
    </div>

    <div id="result" class="waiting">
      📷 等待扫描...<br>Menunggu imbasan...
    </div>
  </div>

  <script>
    /*
     * ================================
     * Config & Global Variables
     * ================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbwdK4-0DDAvOhwIn8d_bPTmmKGMO7myI6gWkNUIMT7FIcHvaX2KDMRVup8bnDOhMIBk/exec";

    let studentCache = {};          // 本地学生信息映射
    let localCheckedSet = new Set(); // 本地今日已打卡学生集合 (秒级防重复)
    
    let scanner = null;
    let cameras = [];
    let currentCamera = null;
    let lastCode = "";
    let isProcessing = false;
    let isSwitching = false;

    /*
     * ================================
     * UI & Speech Utilities
     * ================================
     */
    function showResult(message, type) {
      const result = document.getElementById("result");
      result.className = type;
      result.innerHTML = message;
    }

    function speak(text, language = "zh-CN") {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = language;
      speech.rate = 1.2; // 稍微加快语速，提升流畅感
      speech.pitch = 1;
      window.speechSynthesis.speak(speech);
    }

    /*
     * ================================
     * Camera Management
     * ================================
     */
    function findCamera(type) {
      if (type === "back") {
        return cameras.find(c => {
          const l = c.label.toLowerCase();
          return l.includes("back") || l.includes("rear") || l.includes("environment");
        });
      }
      if (type === "front") {
        return cameras.find(c => {
          const l = c.label.toLowerCase();
          return l.includes("front") || l.includes("user");
        });
      }
      return null;
    }

    function updateCameraButtons(type) {
      document.getElementById("backButton").classList.remove("active");
      document.getElementById("frontButton").classList.remove("active");
      if (type === "back") document.getElementById("backButton").classList.add("active");
      if (type === "front") document.getElementById("frontButton").classList.add("active");
    }

    function startCamera(camera, type) {
      const config = {
        fps: 20, // 提升帧率到 20fps，加快识别反应速度
        qrbox: { width: 220, height: 220 },
        rememberLastUsedCamera: true
      };

      scanner.start(
        camera.id,
        config,
        decodedText => handleQR(decodedText),
        () => {}
      )
      .then(() => {
        currentCamera = type;
        updateCameraButtons(type);
        isSwitching = false;
      })
      .catch(error => {
        console.error(error);
        isSwitching = false;
        showResult("❌ 无法开启相机<br>Tidak dapat membuka kamera", "error");
      });
    }

    function changeCamera(type) {
      if (isSwitching || currentCamera === type) return;

      const camera = findCamera(type);
      if (!camera) {
        showResult("⚠️ 找不到此相机<br>Kamera tidak dijumpai", "error");
        return;
      }

      isSwitching = true;
      if (scanner && scanner.isScanning) {
        scanner.stop()
          .then(() => scanner.clear())
          .then(() => {
            scanner = new Html5Qrcode("reader");
            startCamera(camera, type);
          })
          .catch(error => {
            console.error(error);
            isSwitching = false;
          });
      } else {
        startCamera(camera, type);
      }
    }

    /*
     * ================================
     * Data Pre-loading & Lookup
     * ================================
     */
    async function loadStudents() {
      try {
        showResult("⏳ 正在预加载全校学生资料...<br>Memuatkan maklumat murid...", "waiting");
        
        // 不加 classes 参数，默认拉取全校学生
        const url = API_URL + "?action=students";
        const response = await fetch(url);
        
        if (!response.ok) throw new Error("Network error loading students");

        const result = await response.json();
        if (!result || result.success !== true || !Array.isArray(result.students)) {
          throw new Error("Invalid student dataset");
        }

        studentCache = {};
        result.students.forEach(student => {
          // 同时使用 Barcode 和 StudentID 作为索引键，确保怎么扫都能找到
          if (student.Barcode) {
            studentCache[String(student.Barcode).trim().toUpperCase()] = student;
          }
          if (student.StudentID) {
            studentCache[String(student.StudentID).trim().toUpperCase()] = student;
          }
        });

        showResult("✅ 学生资料已就绪<br>Sedia untuk diimbas", "success");
      } catch (error) {
        console.error("LOAD STUDENTS ERROR:", error);
        showResult("⚠️ 缓存加载失败，将自动依赖网络打卡<br>Mod dalam talian", "waiting");
      }
    }

    function getStudentFromCache(qrCode) {
      const cleanCode = qrCode.trim().toUpperCase();
      return studentCache[cleanCode] || null;
    }

    /*
     * ================================
     * ⚡ Core QR Processing (秒刷逻辑)
     * ================================
     */
    async function handleQR(qrCode) {
      if (isProcessing) return;
      if (qrCode === lastCode) return;

      isProcessing = true;
      lastCode = qrCode;

      const cleanCode = qrCode.trim().toUpperCase();
      const student = getStudentFromCache(cleanCode);

      // 1. 本地防重复打卡检查 (0毫秒响应)
      const studentKey = student ? student.StudentID : cleanCode;
      if (localCheckedSet.has(studentKey)) {
        const displayName = student ? (student.FullNameC || student.FullName) : "学生";
        showResult(
          `<div class='student-name-c'>${displayName}</div>` +
          `<div class='student-info'>${student ? student.Class : ''}</div><br>` +
          `<div>⚠️ 今天已点过名</div><div>Sudah hadir</div>`,
          "error"
        );
        speak("今天已经点名", "zh-CN");
        resetScannerLock(1500); // 1.5秒后解锁扫下一个
        return;
      }

      // 2. 如果本地找到了学生 (秒刷成功路径)
      if (student) {
        const studentName = student.FullNameC || student.FullName;
        
        // 先在前端标记为已打卡
        localCheckedSet.add(studentKey);

        // 🟢 立即在界面弹出成功/展示信息 (不用等网络)
        showResult(
          `<div class='student-name-c'>${studentName}</div>` +
          `<div class='student-info'>${student.Class} · ${student.StudentID}</div><br>` +
          `<div>🟢 打卡成功</div><div>Hadir</div>`,
          "success"
        );
        speak(`${studentName} 已打卡`, "zh-CN");

        // ⚡ 极速静默提交给后台，完全不阻塞前端
        sendAttendanceAsync(student.StudentID, student.Class);

        // 1.2 秒后迅速复原摄像头准备扫下一位
        resetScannerLock(1200);
      } 
      // 3. 本地缓存没找到该学生（回退机制：请求网络）
      else {
        showResult("🔍 正在在线查询学生...<br>Mencari murid...", "waiting");
        try {
          const url = API_URL + "?action=student&barcode=" + encodeURIComponent(cleanCode);
          const response = await fetch(url);
          const result = await response.json();

          if (result && result.success && result.student) {
            const st = result.student;
            localCheckedSet.add(st.StudentID);

            showResult(
              `<div class='student-name-c'>${st.FullNameC || st.FullName}</div>` +
              `<div class='student-info'>${st.Class} · ${st.StudentID}</div><br>` +
              `<div>🟢 打卡成功</div><div>Hadir</div>`,
              "success"
            );
            speak(`${st.FullNameC || ''} 已打卡`, "zh-CN");
            sendAttendanceAsync(st.StudentID, st.Class);
          } else {
            showResult("❌ 找不到学生资料<br>Murid tidak dijumpai", "error");
            speak("找不到学生", "zh-CN");
          }
        } catch (err) {
          console.error(err);
          showResult("❌ 网络连接失败<br>Ralat Rangkaian", "error");
        }
        resetScannerLock(1800);
      }
    }

    /**
     * ⚡ 静默后台异步打卡（Fire and forget）
     */
    function sendAttendanceAsync(studentID, studentClass) {
      const attendanceUrl = API_URL + 
        "?action=attendance" + 
        "&studentID=" + encodeURIComponent(studentID) + 
        "&class=" + encodeURIComponent(studentClass || "");

      fetch(attendanceUrl)
        .then(res => res.json())
        .then(resData => {
          console.log("后台打卡响应:", resData);
          if (!resData.success && resData.message && resData.message.includes("already checked in")) {
            console.warn("后台显示今日已打卡");
          }
        })
        .catch(err => {
          console.error("静默打卡网络提交失败:", err);
        });
    }

    /**
     * 重置扫码锁
     */
    function resetScannerLock(delayMs) {
      setTimeout(() => {
        showResult("📷 等待下一位学生...<br>Menunggu murid seterusnya...", "waiting");
        isProcessing = false;
        lastCode = "";
      }, delayMs);
    }

    /*
     * ================================
     * Initialize System
     * ================================
     */
    function startScanner() {
      scanner = new Html5Qrcode("reader");

      Html5Qrcode.getCameras()
        .then(cameraList => {
          cameras = cameraList;
          if (cameras.length === 0) {
            showResult("❌ 找不到相机<br>Tiada kamera dijumpai", "error");
            return;
          }

          const backCamera = findCamera("back");
          if (backCamera) {
            startCamera(backCamera, "back");
          } else {
            startCamera(cameras[0], "front");
          }
        })
        .catch(error => {
          console.error(error);
          showResult("❌ 无法获取相机权限<br>Tiada kebenaran kamera", "error");
        });
    }

    // 网页加载后，先预加载全校数据，随后立刻启动相机
    loadStudents().finally(() => {
      startScanner();
    });
  </script>
</body>

</html>
