<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>School Attendance QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .camera-button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .waiting {
      background: #f3f4f6;
      color: #555;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .qr-number {
      font-size: 28px;
      margin-top: 8px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>🏫 School Attendance</h1>

    <div class="subtitle">
      扫描学生 QR Code<br>
      <b>Imbas QR Kod Murid</b>
    </div>

    <div id="reader"></div>

    <button
      class="camera-button"
      onclick="switchCamera()">

      🔄 切换相机<br>
      Tukar Kamera

    </button>

    <div
      id="result"
      class="waiting">

      📷 等待扫描...<br>
      Menunggu imbasan...

    </div>

  </div>


<script>

let scanner = null;

let cameras = [];

let currentCameraIndex = 0;

let lastCode = "";

let lastScanTime = 0;

let isProcessing = false;


/*
 * 显示结果
 */

function showResult(
  message,
  type
) {

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = message;

}


/*
 * 英文语音
 */

function speak(
  text
) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 1;

  window.speechSynthesis.speak(
    speech
  );

}


/*
 * 启动指定相机
 */

function startCamera(
  cameraId
) {

  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    rememberLastUsedCamera: true,

    showTorchButtonIfSupported: true,

    showZoomSliderIfSupported: true

  };


  scanner.start(

    cameraId,

    config,

    function(decodedText) {

      handleQR(
        decodedText
      );

    },

    function(errorMessage) {

      /*
       * 正常扫描失败
       * 不显示错误
       */

    }

  )

  .catch(function(error) {

    console.error(error);

    showResult(

      "❌ 无法开启相机<br>" +
      "Tidak dapat membuka kamera",

      "error"

    );

  });

}


/*
 * 开始 Scanner
 */

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  Html5Qrcode
    .getCameras()

    .then(function(cameraList) {

      if (
        !cameraList ||
        cameraList.length === 0
      ) {

        showResult(

          "❌ 找不到相机<br>" +
          "Tiada kamera dijumpai",

          "error"

        );

        return;

      }


      cameras =
        cameraList;


      /*
       * 优先选择后置镜头
       */

      const backCameraIndex =
        cameras.findIndex(
          function(camera) {

            const label =
              camera.label
                .toLowerCase();

            return (

              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment")

            );

          }
        );


      if (
        backCameraIndex !== -1
      ) {

        currentCameraIndex =
          backCameraIndex;

      }


      startCamera(

        cameras[
          currentCameraIndex
        ].id

      );

    })

    .catch(function(error) {

      console.error(error);

      showResult(

        "❌ 无法获取相机<br>" +
        "Tidak dapat mendapatkan kamera",

        "error"

      );

    });

}


/*
 * 切换相机
 */

function switchCamera() {

  if (
    cameras.length < 2
  ) {

    showResult(

      "⚠️ 此设备只有一个相机",

      "error"

    );

    return;

  }


  /*
   * 停止目前相机
   */

  scanner.stop()

    .then(function() {

      /*
       * 切换到下一台相机
       */

      currentCameraIndex =
        (
          currentCameraIndex + 1
        ) %
        cameras.length;


      startCamera(

        cameras[
          currentCameraIndex
        ].id

      );

    })

    .catch(function(error) {

      console.error(
        error
      );

    });

}


/*
 * QR Code 扫描成功
 */

function handleQR(
  qrCode
) {

  const now =
    Date.now();


  if (
    isProcessing
  ) {

    return;

  }


  /*
   * 防止同一个 QR
   * 连续扫描
   */

  if (

    qrCode === lastCode &&

    now - lastScanTime < 3000

  ) {

    return;

  }


  isProcessing = true;

  lastCode =
    qrCode;

  lastScanTime =
    now;


  showResult(

    "✅ 扫描成功<br>" +

    "<div class='qr-number'>" +
    qrCode +
    "</div><br>" +

    "Good morning!<br>" +
    "QR Code scanned successfully.",

    "success"

  );


  speak(

    "Good morning! " +
    "QR Code scanned successfully."

  );


  console.log(
    "QR Code:",
    qrCode
  );


  /*
   * 2 秒后继续扫描下一位
   */

  setTimeout(

    function() {

      showResult(

        "📷 等待下一位学生...<br>" +
        "Menunggu murid seterusnya...",

        "waiting"

      );

      isProcessing =
        false;

    },

    2000

  );

}


startScanner();

</script>

</body>

</html>
