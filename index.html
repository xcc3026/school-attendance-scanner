<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>School Attendance QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .camera-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .camera-button {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .camera-button.active {
      outline: 3px solid #333;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .waiting {
      background: #f3f4f6;
      color: #555;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .qr-number {
      font-size: 28px;
      margin-top: 8px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>🏫 School Attendance</h1>

    <div class="subtitle">
      扫描学生 QR Code<br>
      <b>Imbas QR Kod Murid</b>
    </div>

    <div id="reader"></div>


    <div class="camera-buttons">

      <button
        id="backButton"
        class="camera-button"
        onclick="changeCamera('back')">

        📷 后置镜头<br>
        Kamera Belakang

      </button>


      <button
        id="frontButton"
        class="camera-button"
        onclick="changeCamera('front')">

        🤳 前置镜头<br>
        Kamera Hadapan

      </button>

    </div>


    <div
      id="result"
      class="waiting">

      📷 等待扫描...<br>
      Menunggu imbasan...

    </div>

  </div>


<script>

let scanner = null;

let cameras = [];

let currentCamera = null;

let lastCode = "";

let lastScanTime = 0;

let isProcessing = false;

let isSwitching = false;


/*
 * 显示结果
 */

function showResult(
  message,
  type
) {

  const result =
    document.getElementById("result");

  result.className = type;

  result.innerHTML = message;

}


/*
 * 语音
 */

function speak(
  text
) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 1;

  window.speechSynthesis.speak(
    speech
  );

}


/*
 * 根据前置 / 后置寻找相机
 */

function findCamera(
  type
) {

  if (type === "back") {

    return cameras.find(
      function(camera) {

        const label =
          camera.label.toLowerCase();

        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        );

      }
    );

  }


  if (type === "front") {

    return cameras.find(
      function(camera) {

        const label =
          camera.label.toLowerCase();

        return (
          label.includes("front") ||
          label.includes("user")
        );

      }
    );

  }

}


/*
 * 更新按钮
 */

function updateCameraButtons(
  type
) {

  document
    .getElementById("backButton")
    .classList.remove("active");

  document
    .getElementById("frontButton")
    .classList.remove("active");


  if (type === "back") {

    document
      .getElementById("backButton")
      .classList.add("active");

  }


  if (type === "front") {

    document
      .getElementById("frontButton")
      .classList.add("active");

  }

}


/*
 * 开始指定相机
 */

function startCamera(
  camera,
  type
) {

  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    rememberLastUsedCamera: true,

    showTorchButtonIfSupported: true,

    showZoomSliderIfSupported: true

  };


  scanner.start(

    camera.id,

    config,

    function(decodedText) {

      handleQR(
        decodedText
      );

    },

    function() {

      /*
       * 正常扫描失败
       * 不显示错误
       */

    }

  )

  .then(function() {

    currentCamera =
      type;

    updateCameraButtons(
      type
    );

    isSwitching =
      false;

  })

  .catch(function(error) {

    console.error(error);

    isSwitching =
      false;

    showResult(

      "❌ 无法开启相机<br>" +
      "Tidak dapat membuka kamera",

      "error"

    );

  });

}


/*
 * 切换相机
 */

function changeCamera(
  type
) {

  if (
    isSwitching ||
    currentCamera === type
  ) {

    return;

  }


  const camera =
    findCamera(type);


  if (!camera) {

    showResult(

      "⚠️ 找不到此相机<br>" +
      "Kamera tidak dijumpai",

      "error"

    );

    return;

  }


  isSwitching =
    true;


  /*
   * 停止目前 Scanner
   */

  if (
    scanner.isScanning
  ) {

    scanner.stop()

      .then(function() {

        scanner.clear()

          .then(function() {

            scanner =
              new Html5Qrcode(
                "reader"
              );

            startCamera(
              camera,
              type
            );

          });

      })

      .catch(function(error) {

        console.error(error);

        isSwitching =
          false;

      });

  } else {

    startCamera(
      camera,
      type
    );

  }

}


/*
 * QR 扫描成功
 */

function handleQR(
  qrCode
) {

  const now =
    Date.now();


  if (
    isProcessing
  ) {

    return;

  }


  if (

    qrCode === lastCode &&

    now - lastScanTime < 3000

  ) {

    return;

  }


  isProcessing =
    true;

  lastCode =
    qrCode;

  lastScanTime =
    now;


  showResult(

    "✅ 扫描成功<br>" +

    "<div class='qr-number'>" +
    qrCode +
    "</div><br>" +

    "Good morning!<br>" +
    "QR Code scanned successfully.",

    "success"

  );


  speak(

    "Good morning! " +
    "QR Code scanned successfully."

  );


  setTimeout(

    function() {

      showResult(

        "📷 等待下一位学生...<br>" +
        "Menunggu murid seterusnya...",

        "waiting"

      );

      isProcessing =
        false;

    },

    2000

  );

}


/*
 * 初始化
 */

function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );


  Html5Qrcode
    .getCameras()

    .then(function(cameraList) {

      cameras =
        cameraList;


      if (
        cameras.length === 0
      ) {

        showResult(

          "❌ 找不到相机",

          "error"

        );

        return;

      }


      /*
       * 默认后置镜头
       */

      const backCamera =
        findCamera("back");


      if (backCamera) {

        startCamera(
          backCamera,
          "back"
        );

      } else {

        startCamera(
          cameras[0],
          "front"
        );

      }

    })

    .catch(function(error) {

      console.error(error);

      showResult(

        "❌ 无法获取相机<br>" +
        "Tidak dapat mendapatkan kamera",

        "error"

      );

    });

}


startScanner();

</script>

</body>

</html>
