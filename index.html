<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Attendance QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .camera-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .camera-button {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #e5e7eb;
    }

    .camera-button.active {
      outline: 3px solid #333;
      background: #d1d5db;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .waiting {
      background: #f3f4f6;
      color: #555;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .late {
      background: #fef9c3;
      color: #92400e;
    }

    .student-name-c {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .student-info {
      font-size: 16px;
      color: #4b5563;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🏫 School Attendance</h1>
    <div class="subtitle">
      扫描学生 QR Code<br>
      <b>Imbas QR Kod Murid</b>
    </div>

    <div id="reader"></div>

    <div class="camera-buttons">
      <button id="backButton" class="camera-button" onclick="changeCamera('back')">
        📷 后置镜头<br>Kamera Belakang
      </button>
      <button id="frontButton" class="camera-button" onclick="changeCamera('front')">
        🤳 前置镜头<br>Kamera Hadapan
      </button>
    </div>

    <div id="result" class="waiting">
      📷 等待扫描...<br>Menunggu imbasan...
    </div>
  </div>

  <script>
    /*
     * ================================
     * Config & Global Variables
     * ================================
     */
    const API_URL = "https://script.google.com/macros/s/AKfycbwdK4-0DDAvOhwIn8d_bPTmmKGMO7myI6gWkNUIMT7FIcHvaX2KDMRVup8bnDOhMIBk/exec";

    let studentCache = {};
    let studentsLoaded = false;

    let scanner = null;
    let cameras = [];
    let currentCamera = null;
    let lastCode = "";
    let isProcessing = false;
    let isSwitching = false;

    /*
     * ================================
     * UI & Speech Utilities
     * ================================
     */
    function showResult(message, type) {
      const result = document.getElementById("result");
      result.className = type;
      result.innerHTML = message;
    }

    function speak(text, language = "zh-CN") {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = language;
      speech.rate = 1.1;
      speech.pitch = 1;
      window.speechSynthesis.speak(speech);
    }

    /*
     * ================================
     * Camera Management
     * ================================
     */
    function findCamera(type) {
      if (type === "back") {
        return cameras.find(c => {
          const l = c.label.toLowerCase();
          return l.includes("back") || l.includes("rear") || l.includes("environment");
        });
      }
      if (type === "front") {
        return cameras.find(c => {
          const l = c.label.toLowerCase();
          return l.includes("front") || l.includes("user");
        });
      }
      return null;
    }

    function updateCameraButtons(type) {
      document.getElementById("backButton").classList.remove("active");
      document.getElementById("frontButton").classList.remove("active");
      if (type === "back") document.getElementById("backButton").classList.add("active");
      if (type === "front") document.getElementById("frontButton").classList.add("active");
    }

    function startCamera(camera, type) {
      const config = {
        fps: 15,
        qrbox: { width: 220, height: 220 },
        rememberLastUsedCamera: true
      };

      scanner.start(
        camera.id,
        config,
        decodedText => handleQR(decodedText),
        () => {} // 忽略解码失败时的正常高频回调
      )
      .then(() => {
        currentCamera = type;
        updateCameraButtons(type);
        isSwitching = false;
      })
      .catch(error => {
        console.error(error);
        isSwitching = false;
        showResult("❌ 无法开启相机<br>Tidak dapat membuka kamera", "error");
      });
    }

    function changeCamera(type) {
      if (isSwitching || currentCamera === type) return;

      const camera = findCamera(type);
      if (!camera) {
        showResult("⚠️ 找不到此相机<br>Kamera tidak dijumpai", "error");
        return;
      }

      isSwitching = true;
      if (scanner && scanner.isScanning) {
        scanner.stop()
          .then(() => scanner.clear())
          .then(() => {
            scanner = new Html5Qrcode("reader");
            startCamera(camera, type);
          })
          .catch(error => {
            console.error(error);
            isSwitching = false;
          });
      } else {
        startCamera(camera, type);
      }
    }

    /*
     * ================================
     * Data Pre-loading & Lookup
     * ================================
     */
    async function loadStudents() {
      try {
        showResult("⏳ 正在加载学生资料...<br>Memuatkan maklumat murid...", "waiting");
        
        // 加载全校或特定班级的数据
        const url = API_URL + "?action=students&classes=" + encodeURIComponent("6K,6M");
        const response = await fetch(url);
        
        if (!response.ok) throw new Error("Network error loading students");

        const result = await response.json();
        if (!result || result.success !== true || !Array.isArray(result.students)) {
          throw new Error("Invalid student dataset");
        }

        studentCache = {};
        result.students.forEach(student => {
          if (student.Barcode) {
            studentCache[String(student.Barcode).trim().toUpperCase()] = student;
          }
        });

        studentsLoaded = true;
        showResult("✅ 学生资料已就绪<br>Sedia untuk diimbas", "success");
      } catch (error) {
        console.error("LOAD STUDENTS ERROR:", error);
        studentsLoaded = false;
        showResult("⚠️ 缓存加载失败，将切换至在线查询<br>Mod dalam talian", "waiting");
      }
    }

    async function getStudent(qrCode) {
      const cleanCode = qrCode.trim().toUpperCase();

      // 1. 优先查缓存
      if (studentCache[cleanCode]) {
        return { success: true, student: studentCache[cleanCode] };
      }

      // 2. 缓存找不到再通过网络查询
      try {
        const url = API_URL + "?action=student&barcode=" + encodeURIComponent(cleanCode);
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network error");
        return await response.json();
      } catch (error) {
        console.error("API Error:", error);
        return { success: false, message: "无法连接服务器" };
      }
    }

    /*
     * ================================
     * Core QR Processing
     * ================================
     */
    async function handleQR(qrCode) {
      if (isProcessing) return;
      if (qrCode === lastCode) return;

      isProcessing = true;
      lastCode = qrCode;

      showResult("🔍 查询学生资料...<br>Mencari maklumat murid...", "waiting");

      try {
        const result = await getStudent(qrCode);

        // 验证学生数据
        if (!result || result.success !== true || !result.student) {
          showResult("❌ 找不到学生<br>Murid tidak dijumpai", "error");
          resetScannerLock(2000);
          return;
        }

        const student = result.student;
        if (!student.StudentID || !student.Class) {
          showResult("❌ 学生资料不完整<br>Maklumat murid tidak lengkap", "error");
          resetScannerLock(2000);
          return;
        }

        // 发送点名请求（必须携带 class 参数）
        const attendanceUrl = API_URL + 
          "?action=attendance" + 
          "&studentID=" + encodeURIComponent(student.StudentID) + 
          "&class=" + encodeURIComponent(student.Class);

        const attendanceResponse = await fetch(attendanceUrl);
        const attendanceResult = await attendanceResponse.json();

        // 逻辑判断处理
        if (attendanceResult.success) {
          // 根据后端返回的 status 判断是迟到还是准时
          const rawStatus = String(attendanceResult.status || "").trim();
          const isLate = rawStatus.includes("迟") || 
                         rawStatus.toLowerCase().includes("lewat") || 
                         rawStatus.toLowerCase().includes("late");

          if (isLate) {
            // 🟡 迟到
            showResult(
              `<div class='student-name-c'>${student.FullNameC || student.FullName}</div>` +
              `<div class='student-info'>${student.Class} · ${student.StudentID}</div><br>` +
              `<div>🟡 迟到</div><div>Lewat</div>`,
              "late"
            );
            speak(`${student.FullNameC || ''}，迟到`, "zh-CN");
          } else {
            // 🟢 准时出席
            showResult(
              `<div class='student-name-c'>${student.FullNameC || student.FullName}</div>` +
              `<div class='student-info'>${student.Class} · ${student.StudentID}</div><br>` +
              `<div>🟢 出席成功</div><div>Present · Hadir</div>`,
              "success"
            );
            speak(`${student.FullNameC || ''} 已出席`, "zh-CN");
          }

        } else if (attendanceResult.message && attendanceResult.message.includes("already checked in")) {
          // 重复签到
          showResult(
            `<div class='student-name-c'>${student.FullNameC || student.FullName}</div>` +
            `<div class='student-info'>${student.Class} · ${student.StudentID}</div><br>` +
            `<div>⚠️ 今天已点过名</div><div>Sudah hadir</div>`,
            "error"
          );
          speak("今天已经点名", "zh-CN");

        } else {
          // 签到失败（其他原因）
          showResult(
            `❌ 签到失败: ${attendanceResult.message || '未知错误'}<br>Gagal merekod`,
            "error"
          );
        }

      } catch (error) {
        console.error("QR ERROR:", error);
        showResult("❌ 系统网络错误<br>Ralat sistem", "error");
      }

      resetScannerLock(2000);
    }

    function resetScannerLock(delayMs) {
      setTimeout(() => {
        showResult("📷 等待下一位学生...<br>Menunggu murid seterusnya...", "waiting");
        isProcessing = false;
        lastCode = "";
      }, delayMs);
    }

    /*
     * ================================
     * Initialize System
     * ================================
     */
    function startScanner() {
      scanner = new Html5Qrcode("reader");

      Html5Qrcode.getCameras()
        .then(cameraList => {
          cameras = cameraList;
          if (cameras.length === 0) {
            showResult("❌ 找不到相机<br>Tiada kamera dijumpai", "error");
            return;
          }

          const backCamera = findCamera("back");
          if (backCamera) {
            startCamera(backCamera, "back");
          } else {
            startCamera(cameras[0], "front");
          }
        })
        .catch(error => {
          console.error(error);
          showResult("❌ 无法获取相机权限<br>Tiada kebenaran kamera", "error");
        });
    }

    // 网页加载后，先加载学生数据，再启动相机
    loadStudents().finally(() => {
      startScanner();
    });
  </script>
</body>

</html>
