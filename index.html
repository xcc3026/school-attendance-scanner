<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>School Attendance QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        "Noto Sans SC",
        sans-serif;

      background: #f3f4f6;

      text-align: center;

    }


    .container {

      max-width: 500px;

      margin: auto;

      background: white;

      padding: 20px;

      border-radius: 18px;

      box-shadow:
        0 4px 6px -1px rgba(0,0,0,0.1);

    }


    h1 {

      margin-top: 0;

      margin-bottom: 5px;

    }


    .subtitle {

      color: #666;

      margin-bottom: 20px;

      line-height: 1.5;

    }


    #reader {

      width: 100%;

      margin: auto;

    }


    .camera-buttons {

      display: flex;

      gap: 10px;

      margin-top: 15px;

    }


    .camera-button {

      flex: 1;

      padding: 14px 8px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      background: #e5e7eb;

    }


    .camera-button.active {

      outline: 3px solid #333;

      background: #d1d5db;

    }


    #result {

      margin-top: 20px;

      padding: 20px;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

      min-height: 150px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      line-height: 1.5;

      word-break: break-word;

    }


    .waiting {

      background: #f3f4f6;

      color: #555;

    }


    .success {

      background: #dcfce7;

      color: #166534;

    }


    .error {

      background: #fee2e2;

      color: #991b1b;

    }


    .late {

      background: #fef9c3;

      color: #92400e;

    }


    .student-name-c {

      font-size: 30px;

      margin-bottom: 5px;

    }


    .student-name-en {

      font-size: 16px;

      color: #4b5563;

      font-weight: normal;

    }


    .student-info {

      font-size: 16px;

      color: #4b5563;

      margin-top: 5px;

      font-weight: normal;

    }


    .attendance-time {

      font-size: 14px;

      margin-top: 8px;

      font-weight: normal;

    }


    .already-status {

      font-size: 20px;

      margin-top: 8px;

    }


    .debug-code {

      margin-top: 12px;

      font-size: 12px;

      color: #6b7280;

      font-weight: normal;

      word-break: break-all;

    }


    .system-status {

      margin-top: 10px;

      font-size: 12px;

      color: #777;

      font-weight: normal;

    }

  </style>

</head>


<body>


  <div class="container">


    <h1>
      🏫 School Attendance
    </h1>


    <div class="subtitle">

      扫描学生 QR Code

      <br>

      <b>
        Imbas QR Kod Murid
      </b>

    </div>


    <div id="reader"></div>


    <div class="camera-buttons">


      <button
        id="backButton"
        class="camera-button"
        onclick="changeCamera('back')"
      >

        📷 后置镜头

        <br>

        Kamera Belakang

      </button>


      <button
        id="frontButton"
        class="camera-button"
        onclick="changeCamera('front')"
      >

        🤳 前置镜头

        <br>

        Kamera Hadapan

      </button>


    </div>


    <div
      id="result"
      class="waiting"
    >

      ⏳ 正在加载学生资料...

      <br>

      Memuatkan maklumat murid...

    </div>


  </div>


  <script>


    /*
     * =========================================================
     * API
     * =========================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwdK4-0DDAvOhwIn8d_bPTmmKGMO7myI6gWkNUIMT7FIcHvaX2KDMRVup8bnDOhMIBk/exec";


    /*
     * =========================================================
     * 迟到时间
     *
     * 06:46 开始 = Late
     * =========================================================
     */

    const LATE_TIME_MINUTES =
      6 * 60 + 46;


    /*
     * =========================================================
     * GLOBAL
     * =========================================================
     */

    let studentCache = {};

    let localCheckedSet =
      new Set();

    let attendanceStatusMap =
      {};

    let scanner =
      null;

    let cameras =
      [];

    let currentCamera =
      null;

    let lastCode =
      "";

    let isProcessing =
      false;

    let isSwitching =
      false;


    /*
     * =========================================================
     * UI
     * =========================================================
     */

    function showResult(
      message,
      type
    ) {

      const result =
        document.getElementById(
          "result"
        );

      result.className =
        type;

      result.innerHTML =
        message;

    }


    /*
     * =========================================================
     * SPEECH
     * =========================================================
     */

    function speak(
      text,
      language = "zh-CN"
    ) {

      if (
        !("speechSynthesis" in window)
      ) {

        return;

      }


      try {

        window.speechSynthesis.cancel();

        const speech =
          new SpeechSynthesisUtterance(
            text
          );

        speech.lang =
          language;

        speech.rate =
          1.15;

        speech.pitch =
          1;

        window.speechSynthesis.speak(
          speech
        );

      }

      catch (error) {

        console.warn(
          "Speech error:",
          error
        );

      }

    }


    /*
     * =========================================================
     * NORMALIZE QR
     *
     * 处理：
     *
     * 01685/23
     * 01685/23 空格
     * 大小写
     * 隐藏换行
     * =========================================================
     */

    function normalizeCode(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .trim()

        .replace(
          /\s+/g,
          ""
        )

        .toUpperCase();

    }


    /*
     * =========================================================
     * CAMERA
     * =========================================================
     */

    function findCamera(
      type
    ) {

      if (
        type === "back"
      ) {

        return cameras.find(
          camera => {

            const label =
              (
                camera.label ||
                ""
              ).toLowerCase();


            return (

              label.includes("back") ||

              label.includes("rear") ||

              label.includes("environment") ||

              label.includes("后置")

            );

          }
        );

      }


      if (
        type === "front"
      ) {

        return cameras.find(
          camera => {

            const label =
              (
                camera.label ||
                ""
              ).toLowerCase();


            return (

              label.includes("front") ||

              label.includes("user") ||

              label.includes("前置")

            );

          }
        );

      }


      return null;

    }


    function updateCameraButtons(
      type
    ) {

      document
        .getElementById(
          "backButton"
        )
        .classList
        .remove("active");


      document
        .getElementById(
          "frontButton"
        )
        .classList
        .remove("active");


      if (
        type === "back"
      ) {

        document
          .getElementById(
            "backButton"
          )
          .classList
          .add("active");

      }


      if (
        type === "front"
      ) {

        document
          .getElementById(
            "frontButton"
          )
          .classList
          .add("active");

      }

    }


    function startCamera(
      camera,
      type
    ) {

      if (
        !scanner
      ) {

        scanner =
          new Html5Qrcode(
            "reader"
          );

      }


      const config = {

        fps: 20,

        qrbox: {

          width: 220,

          height: 220

        },

        rememberLastUsedCamera:
          true

      };


      scanner
        .start(

          camera.id,

          config,

          decodedText => {

            handleQR(
              decodedText
            );

          },

          () => {}

        )

        .then(() => {

          currentCamera =
            type;

          updateCameraButtons(
            type
          );

          isSwitching =
            false;

          console.log(
            "Camera started:",
            type
          );

        })

        .catch(error => {

          console.error(
            "CAMERA START ERROR:",
            error
          );

          isSwitching =
            false;

          showResult(

            "❌ 无法开启相机<br>" +

            "Tidak dapat membuka kamera<br>" +

            `<div class="system-status">${escapeHtml(String(error))}</div>`,

            "error"

          );

        });

    }


    function changeCamera(
      type
    ) {

      if (
        isSwitching ||
        currentCamera === type
      ) {

        return;

      }


      const camera =
        findCamera(type);


      if (!camera) {

        showResult(

          "⚠️ 找不到此相机<br>" +

          "Kamera tidak dijumpai",

          "error"

        );

        return;

      }


      isSwitching =
        true;


      if (
        scanner &&
        scanner.isScanning
      ) {

        scanner

          .stop()

          .then(() => {

            try {

              scanner.clear();

            }

            catch (e) {

              console.warn(
                e
              );

            }


            scanner =
              new Html5Qrcode(
                "reader"
              );


            startCamera(
              camera,
              type
            );

          })

          .catch(error => {

            console.error(
              error
            );

            isSwitching =
              false;

          });

      }

      else {

        scanner =
          new Html5Qrcode(
            "reader"
          );

        startCamera(
          camera,
          type
        );

      }

    }


    /*
     * =========================================================
     * LOAD ALL STUDENTS
     * =========================================================
     */

    async function loadStudents() {

      try {

        showResult(

          "⏳ 正在加载全校学生资料...<br>" +

          "Memuatkan maklumat semua murid...",

          "waiting"

        );


        const url =
          API_URL +
          "?action=students";


        console.log(
          "Loading students:",
          url
        );


        const response =
          await fetch(
            url,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const result =
          await response.json();


        if (
          !result ||
          result.success !== true ||
          !Array.isArray(
            result.students
          )
        ) {

          throw new Error(
            "Invalid student dataset"
          );

        }


        studentCache =
          {};


        result.students.forEach(
          student => {

            if (
              student.Barcode
            ) {

              const barcode =
                normalizeCode(
                  student.Barcode
                );


              if (
                barcode
              ) {

                studentCache[
                  barcode
                ] =
                  student;

              }

            }


            if (
              student.StudentID
            ) {

              const studentID =
                normalizeCode(
                  student.StudentID
                );


              if (
                studentID
              ) {

                studentCache[
                  studentID
                ] =
                  student;

              }

            }

          }
        );


        const totalStudents =
          result.students.length;


        console.log(
          "Students loaded:",
          totalStudents
        );


        showResult(

          "✅ 学生资料已就绪<br>" +

          "Sedia untuk diimbas<br>" +

          `<div class="system-status">${totalStudents} 名学生资料已加载</div>`,

          "success"

        );


      }

      catch (error) {

        console.error(
          "LOAD STUDENTS ERROR:",
          error
        );


        showResult(

          "⚠️ 学生资料预加载失败<br>" +

          "系统将使用在线查询<br>" +

          `<div class="system-status">错误：${escapeHtml(error.message || String(error))}</div>`,

          "waiting"

        );

      }

    }


    /*
     * =========================================================
     * CACHE LOOKUP
     * =========================================================
     */

    function getStudentFromCache(
      qrCode
    ) {

      const code =
        normalizeCode(
          qrCode
        );


      if (
        !code
      ) {

        return null;

      }


      return (
        studentCache[code] ||
        null
      );

    }


    /*
     * =========================================================
     * HTML ESCAPE
     * =========================================================
     */

    function escapeHtml(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
     * =========================================================
     * TIME
     *
     * 06:46 = Late
     * =========================================================
     */

    function getCurrentAttendanceInfo() {

      const now =
        new Date();


      const hours =
        now.getHours();


      const minutes =
        now.getMinutes();


      const seconds =
        now.getSeconds();


      const totalMinutes =
        hours * 60 +
        minutes;


      const isLate =
        totalMinutes >=
        LATE_TIME_MINUTES;


      const timeStr =

        String(hours)
          .padStart(2, "0")

        + ":" +

        String(minutes)
          .padStart(2, "0")

        + ":" +

        String(seconds)
          .padStart(2, "0");


      return {

        status:
          isLate
            ? "Late"
            : "Present",

        time:
          timeStr

      };

    }


    /*
     * =========================================================
     * NORMALIZE ATTENDANCE STATUS
     * =========================================================
     */

    function normalizeAttendanceStatus(
      status
    ) {

      const value =
        String(status || "")
          .trim()
          .toLowerCase();


      if (

        value === "late" ||

        value === "lewat" ||

        value.includes("迟到")

      ) {

        return "Late";

      }


      if (

        value === "present" ||

        value === "hadir" ||

        value.includes("出席") ||

        value.includes("准时")

      ) {

        return "Present";

      }


      return null;

    }


    /*
     * =========================================================
     * STUDENT DISPLAY
     * =========================================================
     */

    function getStudentNameC(
      student
    ) {

      return escapeHtml(
        student.FullNameC ||
        student.FullName ||
        "学生"
      );

    }


    function getStudentNameEN(
      student
    ) {

      return escapeHtml(
        student.FullName ||
        ""
      );

    }


    function getStudentClass(
      student
    ) {

      return escapeHtml(
        student.Class ||
        ""
      );

    }


    function getStudentID(
      student
    ) {

      return escapeHtml(
        student.StudentID ||
        ""
      );

    }


    /*
     * =========================================================
     * FIRST ATTENDANCE
     * =========================================================
     */

    function showFirstAttendance(
      student,
      attendanceInfo
    ) {

      const nameC =
        getStudentNameC(
          student
        );


      const nameEN =
        getStudentNameEN(
          student
        );


      const studentClass =
        getStudentClass(
          student
        );


      const studentID =
        getStudentID(
          student
        );


      if (
        attendanceInfo.status ===
        "Late"
      ) {

        showResult(

          `<div class="student-name-c">${nameC}</div>` +

          `<div class="student-name-en">${nameEN}</div>` +

          `<div class="student-info">` +

          `${studentClass} · ${studentID}` +

          `</div>` +

          `<br>` +

          `<div>🟡 迟到 Lewat</div>` +

          `<div class="attendance-time">` +

          `打卡时间：${attendanceInfo.time}` +

          `</div>`,

          "late"

        );


        speak(
          `${student.FullNameC || student.FullName || "学生"}，注意，你今天迟到了`,
          "zh-CN"
        );

      }

      else {

        showResult(

          `<div class="student-name-c">${nameC}</div>` +

          `<div class="student-name-en">${nameEN}</div>` +

          `<div class="student-info">` +

          `${studentClass} · ${studentID}` +

          `</div>` +

          `<br>` +

          `<div>🟢 准时出席 Hadir</div>` +

          `<div class="attendance-time">` +

          `打卡时间：${attendanceInfo.time}` +

          `</div>`,

          "success"

        );


        speak(
          `${student.FullNameC || student.FullName || "学生"}，打卡成功`,
          "zh-CN"
        );

      }

    }


    /*
     * =========================================================
     * ALREADY CHECKED
     * =========================================================
     */

    function showAlreadyChecked(
      student,
      attendanceInfo
    ) {

      const nameC =
        getStudentNameC(
          student
        );


      const nameEN =
        getStudentNameEN(
          student
        );


      const studentClass =
        getStudentClass(
          student
        );


      const studentID =
        getStudentID(
          student
        );


      const status =
        attendanceInfo &&
        attendanceInfo.status
          ? normalizeAttendanceStatus(
              attendanceInfo.status
            )
          : "Present";


      const time =
        attendanceInfo &&
        attendanceInfo.time
          ? escapeHtml(
              attendanceInfo.time
            )
          : "";


      if (
        status === "Late"
      ) {

        showResult(

          `<div class="student-name-c">${nameC}</div>` +

          `<div class="student-name-en">${nameEN}</div>` +

          `<div class="student-info">` +

          `${studentClass} · ${studentID}` +

          `</div>` +

          `<br>` +

          `<div class="already-status">` +

          `⚠️ 今日已打卡 · 迟到` +

          `</div>` +

          `<div>Sudah hadir · Lewat</div>` +

          (

            time

              ? `<div class="attendance-time">` +

                `原打卡时间：${time}` +

                `</div>`

              : ""

          ),

          "late"

        );


        speak(
          `${student.FullNameC || student.FullName || "学生"}，今天已经打卡，你迟到了`,
          "zh-CN"
        );

      }

      else {

        showResult(

          `<div class="student-name-c">${nameC}</div>` +

          `<div class="student-name-en">${nameEN}</div>` +

          `<div class="student-info">` +

          `${studentClass} · ${studentID}` +

          `</div>` +

          `<br>` +

          `<div class="already-status">` +

          `⚠️ 今日已打卡 · 准时` +

          `</div>` +

          `<div>Sudah hadir · Tepat pada masa</div>` +

          (

            time

              ? `<div class="attendance-time">` +

                `原打卡时间：${time}` +

                `</div>`

              : ""

          ),

          "error"

        );


        speak(
          `${student.FullNameC || student.FullName || "学生"}，今天已经打卡`,
          "zh-CN"
        );

      }

    }


    /*
     * =========================================================
     * QR PROCESSING
     * =========================================================
     */

    async function handleQR(
      qrCode
    ) {

      if (
        isProcessing
      ) {

        return;

      }


      const cleanCode =
        normalizeCode(
          qrCode
        );


      if (
        !cleanCode
      ) {

        return;

      }


      /*
       * 防止同一个 QR 连续触发
       */

      if (
        cleanCode ===
        lastCode
      ) {

        return;

      }


      isProcessing =
        true;

      lastCode =
        cleanCode;


      console.log(
        "QR SCANNED:",
        qrCode
      );

      console.log(
        "QR NORMALIZED:",
        cleanCode
      );


      /*
       * =====================================================
       * 1. 本地缓存
       * =====================================================
       */

      const student =
        getStudentFromCache(
          cleanCode
        );


      /*
       * =====================================================
       * 2. 找不到 → 在线查询
       * =====================================================
       */

      if (
        !student
      ) {

        await handleOnlineStudentLookup(
          cleanCode,
          qrCode
        );

        return;

      }


      /*
       * =====================================================
       * 3. Student Key
       * =====================================================
       */

      const studentKey =
        normalizeCode(
          student.StudentID ||
          cleanCode
        );


      /*
       * =====================================================
       * 4. 本页面已经扫描过
       * =====================================================
       */

      if (
        localCheckedSet.has(
          studentKey
        )
      ) {

        showAlreadyChecked(

          student,

          attendanceStatusMap[
            studentKey
          ]

        );


        resetScannerLock(
          1500
        );

        return;

      }


      /*
       * =====================================================
       * 5. 第一次扫码
       * =====================================================
       */

      const attendanceInfo =
        getCurrentAttendanceInfo();


      /*
       * 先保存本地状态
       */

      attendanceStatusMap[
        studentKey
      ] = {

        status:
          attendanceInfo.status,

        time:
          attendanceInfo.time

      };


      localCheckedSet.add(
        studentKey
      );


      /*
       * =====================================================
       * 6. 立即显示
       * =====================================================
       */

      showFirstAttendance(
        student,
        attendanceInfo
      );


      /*
       * =====================================================
       * 7. 后台提交
       * =====================================================
       */

      sendAttendance(
        student,
        studentKey,
        attendanceInfo
      );


      /*
       * =====================================================
       * 8. 继续扫描
       * =====================================================
       */

      resetScannerLock(
        1200
      );

    }


    /*
     * =========================================================
     * ONLINE STUDENT LOOKUP
     * =========================================================
     */

    async function handleOnlineStudentLookup(
      cleanCode,
      originalCode
    ) {

      showResult(

        "🔍 正在查询学生资料...<br>" +

        "Mencari murid...",

        "waiting"

      );


      try {

        const url =
          API_URL +

          "?action=student&barcode=" +

          encodeURIComponent(
            cleanCode
          );


        console.log(
          "ONLINE LOOKUP:",
          url
        );


        const response =
          await fetch(
            url,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const result =
          await response.json();


        console.log(
          "ONLINE RESULT:",
          result
        );


        /*
         * 找到学生
         */

        if (
          result &&
          result.success === true &&
          result.student
        ) {

          const student =
            result.student;


          /*
           * 加入缓存
           */

          if (
            student.Barcode
          ) {

            studentCache[
              normalizeCode(
                student.Barcode
              )
            ] =
              student;

          }


          if (
            student.StudentID
          ) {

            studentCache[
              normalizeCode(
                student.StudentID
              )
            ] =
              student;

          }


          const studentKey =
            normalizeCode(
              student.StudentID ||
              cleanCode
            );


          /*
           * 第二次
           */

          if (
            localCheckedSet.has(
              studentKey
            )
          ) {

            showAlreadyChecked(

              student,

              attendanceStatusMap[
                studentKey
              ]

            );


            resetScannerLock(
              1500
            );

            return;

          }


          /*
           * 第一次
           */

          const attendanceInfo =
            getCurrentAttendanceInfo();


          attendanceStatusMap[
            studentKey
          ] = {

            status:
              attendanceInfo.status,

            time:
              attendanceInfo.time

          };


          localCheckedSet.add(
            studentKey
          );


          showFirstAttendance(
            student,
            attendanceInfo
          );


          sendAttendance(
            student,
            studentKey,
            attendanceInfo
          );


          resetScannerLock(
            1200
          );


          return;

        }


        /*
         * 学生不存在
         */

        showResult(

          "❌ 找不到学生资料<br>" +

          "Murid tidak dijumpai<br>" +

          `<div class="debug-code">扫描内容：${escapeHtml(originalCode)}</div>`,

          "error"

        );


        speak(
          "找不到学生",
          "zh-CN"
        );


      }

      catch (error) {

        console.error(
          "ONLINE LOOKUP ERROR:",
          error
        );


        /*
         * 这里不再简单写：
         *
         * 网络连接失败
         *
         * 而是告诉我们真正是什么错误。
         */

        showResult(

          "❌ 在线查询失败<br>" +

          "Gagal mencari secara dalam talian<br>" +

          `<div class="debug-code">扫描内容：${escapeHtml(originalCode)}</div>` +

          `<div class="system-status">错误：${escapeHtml(error.message || String(error))}</div>`,

          "error"

        );

      }


      resetScannerLock(
        2000
      );

    }


    /*
     * =========================================================
     * SEND ATTENDANCE
     *
     * 对应 Code.gs：
     *
     * action=attendance
     *
     * 实际调用：
     *
     * recordAttendance()
     *
     * =========================================================
     */

    function sendAttendance(
      student,
      studentKey,
      localAttendanceInfo
    ) {

      const studentID =
        student.StudentID ||
        studentKey;


      const studentClass =
        student.Class ||
        "";


      const attendanceUrl =

        API_URL +

        "?action=attendance" +

        "&studentID=" +

        encodeURIComponent(
          studentID
        ) +

        "&class=" +

        encodeURIComponent(
          studentClass
        ) +

        "&method=QR";


      console.log(
        "ATTENDANCE URL:",
        attendanceUrl
      );


      fetch(
        attendanceUrl,
        {
          method: "GET",
          cache: "no-store"
        }
      )

        .then(
          response => {

            if (
              !response.ok
            ) {

              throw new Error(
                "HTTP " +
                response.status
              );

            }


            return response.json();

          }
        )

        .then(
          data => {

            console.log(
              "后台打卡响应:",
              data
            );


            /*
             * =================================================
             * 情况 1：
             *
             * 今天已经存在记录
             *
             * success:false
             * alreadyCheckedIn:true
             *
             * =================================================
             */

            if (
              data &&
              data.success === false &&
              (
                data.alreadyCheckedIn === true ||
                String(
                  data.message || ""
                )
                  .toLowerCase()
                  .includes(
                    "already checked in"
                  )
              )
            ) {

              const backendStatus =
                normalizeAttendanceStatus(
                  data.status
                );


              if (
                backendStatus
              ) {

                attendanceStatusMap[
                  studentKey
                ] = {

                  status:
                    backendStatus,

                  time:
                    data.scanTime ||
                    localAttendanceInfo.time

                };


                /*
                 * 如果这是页面刚刚扫到，
                 * 但后台其实已经有记录，
                 * 这里重新显示正确的
                 * 「今日已打卡」。
                 */

                showAlreadyChecked(

                  student,

                  attendanceStatusMap[
                    studentKey
                  ]

                );

              }


              return;

            }


            /*
             * =================================================
             * 情况 2：
             *
             * 第一次成功写入
             *
             * Apps Script 会返回：
             *
             * success:true
             * status:"迟到 Lewat"
             *
             * 或：
             *
             * status:"出席 Hadir"
             *
             * =================================================
             */

            if (
              data &&
              data.success === true
            ) {

              const backendStatus =
                normalizeAttendanceStatus(
                  data.status
                );


              if (
                backendStatus
              ) {

                attendanceStatusMap[
                  studentKey
                ] = {

                  status:
                    backendStatus,

                  time:
                    data.scanTime ||
                    localAttendanceInfo.time

                };


                console.log(
                  "后台最终状态:",
                  backendStatus
                );

              }

            }

          }
        )

        .catch(
          error => {

            /*
             * 后台失败不影响已经显示给学生的结果。
             *
             * 但 Console 会保留真正错误。
             */

            console.error(
              "ATTENDANCE SUBMIT ERROR:",
              error
            );

          }
        );

    }


    /*
     * =========================================================
     * RESET SCANNER
     * =========================================================
     */

    function resetScannerLock(
      delayMs
    ) {

      setTimeout(
        () => {

          showResult(

            "📷 等待下一位学生...<br>" +

            "Menunggu murid seterusnya...",

            "waiting"

          );


          isProcessing =
            false;

          lastCode =
            "";

        },

        delayMs

      );

    }


    /*
     * =========================================================
     * START SCANNER
     * =========================================================
     */

    function startScanner() {

      scanner =
        new Html5Qrcode(
          "reader"
        );


      Html5Qrcode
        .getCameras()

        .then(
          cameraList => {

            cameras =
              cameraList || [];


            console.log(
              "CAMERAS:",
              cameras
            );


            if (
              cameras.length === 0
            ) {

              showResult(

                "❌ 找不到相机<br>" +

                "Tiada kamera dijumpai",

                "error"

              );

              return;

            }


            /*
             * 优先后置镜头
             */

            const backCamera =
              findCamera(
                "back"
              );


            if (
              backCamera
            ) {

              startCamera(
                backCamera,
                "back"
              );

            }

            else {

              startCamera(
                cameras[0],
                "front"
              );

            }

          }
        )

        .catch(
          error => {

            console.error(
              "GET CAMERAS ERROR:",
              error
            );


            showResult(

              "❌ 无法获取相机权限<br>" +

              "Tiada kebenaran kamera<br>" +

              `<div class="system-status">${escapeHtml(error.message || String(error))}</div>`,

              "error"

            );

          }
        );

    }


    /*
     * =========================================================
     * INITIALIZE
     *
     * 先加载学生资料
     * 再启动相机
     * =========================================================
     */

    loadStudents()

      .finally(
        () => {

          startScanner();

        }
      );


  </script>
